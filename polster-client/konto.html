<!doctype html><html lang="de"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://jthmekehipiolsxtjavb.supabase.co; connect-src 'self' https://jthmekehipiolsxtjavb.supabase.co data: blob:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Konto – Polsterhaus Muster (Demo)</title><link rel="stylesheet" href="style.css?v=8"></head><body>
<header><div class="wrap nav"><a class="logo" href="index.html">Polsterhaus Muster</a><div class="hd-r"><span id="who" class="note"></span><button class="lnk" id="out">Abmelden</button></div></div></header>
<main class="wrap" style="padding:36px 20px;max-width:760px"><p><a href="index.html">← zurück zum Shop</a></p><h1>Meine Bestellungen</h1><div id="ok"></div><div id="l"></div></main>
<script src="config.js?v=30"></script><script src="i18n.js?v=30"></script><script src="vendor/supabase.js"></script><script src="store.js?v=30"></script><script>
(async()=>{const u=await initAuth();if(!u){location.href='index.html';return}
document.getElementById('who').textContent=u.name;document.getElementById('out').onclick=async()=>{await user.out();location.href='index.html'};
const neu=new URLSearchParams(location.search).get('neu');if(neu)document.getElementById('ok').innerHTML=`<div class="box" style="margin-bottom:18px;border-color:var(--acc)"><b>Danke für Ihre Bestellung ${esc(neu)}!</b><br><span class="note">Den Status Ihrer Bestellung sehen Sie hier.</span></div>`;
async function draw(){const r=await SB.from('orders').select('*').order('created_at',{ascending:false});const a=r.data||[];document.getElementById('l').innerHTML=a.length?a.map(o=>{const s=stepOf(o);return`<div class="ord"><div style="display:flex;justify-content:space-between"><b>${esc(o.id)}</b><b>${(+o.total).toLocaleString('de-DE')} €</b></div><div class="note">${new Date(o.created_at).toLocaleString('de-DE')} · ${esc(o.lv)}: ${esc(o.ort)} · ${esc(o.zh)}</div><ul style="margin:10px 0;padding-left:18px">${o.items.map(i=>`<li>${i.q}× ${esc(i.n)}</li>`).join('')}</ul>${o.tracking?`<p><a class="btn o sm" target="_blank" href="https://www.dhl.de/de/privatkunden/dhl-sendungsverfolgung.html?piececode=${encodeURIComponent(o.tracking)}">Sendung verfolgen (${esc(o.tracking)})</a></p>`:''}<ul class="tl">${STEPS.map((t,i)=>`<li class="${i<=s?'d':''}"><i></i>${o.lv==='Abholung'&&i===3?'Bereit zur Abholung':t}</li>`).join('')}</ul></div>`}).join(''):'<p class="note">Noch keine Bestellungen.</p>'}
draw();setInterval(draw,15000)})();
</script></body></html>
