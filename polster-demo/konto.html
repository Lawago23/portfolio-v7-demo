<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Konto – Polsterhaus Muster (Demo)</title><link rel="stylesheet" href="style.css?v=7"></head><body>
<header><div class="wrap nav"><a class="logo" href="index.html">Polsterhaus Muster</a><div class="hd-r"><span id="who" class="note"></span><button class="lnk" id="out">Abmelden</button></div></div></header>
<main class="wrap" style="padding:36px 20px;max-width:760px"><p><a href="index.html">← zurück zum Shop</a></p><h1>Meine Bestellungen</h1><div id="ok"></div><div id="l"></div></main>
<script src="store.js?v=7"></script><script>
const u=user.get();if(!u)location.href='index.html';
document.getElementById('who').textContent=u.name;document.getElementById('out').onclick=()=>{user.out();location.href='index.html'};
const neu=new URLSearchParams(location.search).get('neu');if(neu)document.getElementById('ok').innerHTML=`<div class="box" style="margin-bottom:18px;border-color:var(--acc)"><b>Danke für Ihre Bestellung ${neu}!</b><br><span class="note">Eine Bestätigung wäre jetzt per E-Mail unterwegs (Demo).</span></div>`;
function draw(){const a=orders.all().filter(o=>o.email===u.email);document.getElementById('l').innerHTML=a.length?a.map(o=>{const s=stepOf(o);return`<div class="ord"><div style="display:flex;justify-content:space-between"><b>${o.id}</b><b>${o.total.toLocaleString('de-DE')} €</b></div><div class="note">${new Date(o.t).toLocaleString('de-DE')} · ${o.lv}: ${o.ort} · ${o.zh}</div><ul style="margin:10px 0;padding-left:18px">${o.items.map(i=>`<li>${i.q}× ${i.n}</li>`).join('')}</ul><ul class="tl">${STEPS.map((t,i)=>`<li class="${i<=s?'d':''}"><i></i>${o.lv==='Abholung'&&i===3?'Bereit zur Abholung':t}</li>`).join('')}</ul><div class="note">Demo: Der Status schreitet alle 20 Sekunden fort. Echt: Daten vom Versanddienstleister.</div></div>`}).join(''):'<p class="note">Noch keine Bestellungen.</p>'}
draw();setInterval(draw,5000);
</script></body></html>
